<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2</title>

        <style>
            #i1{
            height: 50px;
            width: 350px;
            border-radius: 1px;
            border: 2px solid black;
            }

            #i2{
            height: 50px;
            width: 350px;
            border-bottom: 2px solid red;
            }

            #i3{
            height: 50px;
            width: 350px;
            border-radius: 13px;
            border: 1px solid gray;
            }

            #i4{
              height: 50px;
              width: 350px;
                background-color: aquamarine;
                border-left: 5px solid blue;
            }
        </style>
</head>
<body>
    <p id="i1">borders on all sides</p>
    <p id="i2">red bottom border</p>
    <p id="i3">rounded border</p>
    <p id="i4">blue left border</p>
</body>
</html>
