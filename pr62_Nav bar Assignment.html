<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar Assignment</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            margin: auto;
        }

        nav {
            display: flex;
            align-items: center;
            background-color:teal;
            color: white;
            padding: 20px;      
          }

        ul {
            list-style: none;
        }


        li {
            display: inline-block;
            margin-right: 20px;
        }

        a {
            text-decoration: none;
            color: white;
        }

        .b1 {
            background-color: black;
            color: white;
            padding: 7px;
            border-radius: 7px;
        }

        .b1:hover {
            background-color: white;
            color: black;
        }

        li:hover{
            background-color: blueviolet;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav>
        <h1>NAVBAR</h1>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Blog</a></li>
            <li><a href="">Contact</a></li>
            <li><a href="" class="b1">Sign In</a></li>
            <li><a href="" class="b1">Sign Up</a></li>
        </ul>
    </nav>
</body>
</html>
