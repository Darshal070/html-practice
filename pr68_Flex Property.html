<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .c1{
            border: 1px solid darkgoldenrod;
            height: 100px;
            width: 100px;
        }

        .parent{
            display: flex;
            height: 450px;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            column-gap: 10px;
            gap: 10px;
            row-gap: 10px;
        }

    </style>
</head>
<body>

    <div class="parent">   
    <div class="c1"></div>
    <div class="c1"></div>
    <div class="c1"></div>
    <div class="c1"></div>

    </div>
</body>
</html>
