<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Login Pages</title>

    <style>

        body{
            background-color: lightblue; text-align: center; font-family: Arial;
        }

        h1{
            background-color: white;
            color: darkblue;
            padding: 30px;
            border-radius: 30px;
        }

        img{
            margin: 30px;
            border-radius: 30px;
            transition: 0.3s;
        }

        img:hover{
            transform: scale(1.05);
        }

        p{
            font-size: 22px;
        }

    </style>

</head>

<body>

    <h1>Social Media Login Pages</h1>

    <p>
        Click on any image to open its login page.
    </p>

    <a href="https://www.instagram.com/accounts/login/" target="_blank">

        <img src="Log.png"
        height="200px"
        width="200px">

    </a>

    <a href="https://accounts.snapchat.com/accounts/login" target="_blank">

        <img src="snap.png"
        height="200px"
        width="200px">

    </a>

    <a href="https://www.facebook.com/login/" target="_blank">

        <img src="facebook.png"
        height="200px"
        width="200px">

    </a>

</body>

</html>
