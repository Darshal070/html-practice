<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding and Margine</title>
    <style>
        .c1{
            border: 1px solid black;
        }
        #i1{
            width: 480px;
            padding: 10px 10px 10px 240px;
            margin: auto;
        }

         #i2{
            padding: 10px 10px 10px 240px;
            margin: 10px 10px 10px 10px;
        }

         #i3{
            padding: 10px 10px 10px 240px;
            margin: 10px 10px 10px 10px;
        }

         #i4{
            padding: 10px 10px 10px 240px;
            margin: 10px 10px 10px 10px;
        }

    </style>
</head>
<body>
    <h1>Padding Property</h1>
        <p class="c1" id="i1">HELLO</p>
        <p class="c1" id="i2">HELLO</p>
        <p class="c1" id="i3">HELLO</p>
        <p class="c1" id="i4">HELLO</p>
    </h1>
</body>
</html>
