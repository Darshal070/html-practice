<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video tag</title>
</head>
<body>
    <h1>Video Tag</h1>
    <video src="v2.mp4" height="200px" width="200px" controls poster="peacock.png"></video> 

     <video src="v2.mp4" height="200px" width="200px" autoplay muted controls></video>

    <h2>Audio Tag</h2>
    <video src="v2.mp4" height="200px" width="200px" autoplay muted controls></video>
    <audio src="v2.mp4" controls></audio>

</body>
</html>
