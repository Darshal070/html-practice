<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List type</title>
</head>
<body>

    <h1>Orderd list</h1>
    <ol type="i" start="4"> 
        <li>apple</li>
        <li>mango</li>
        <li>banana</li>
    </ol>

    <h1>Unorderd list</h1>
     <ul type="circle"> 
        <li>apple</li>
        <li>mango</li>
        <li>banana</li>
     </ul>

     <h1>Unorderd list</h1>
     <ul style="list-style-type: disc;" > 
        <li>apple</li>
        <li>mango</li>
        <li>banana</li>
     </ul>

     <h1>Description/Defination List</h1>
     <dl>
        <dt>HTML</dt>
        <dd>Hypertext Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading style sheet</dd>
        <dt>JS</dt>
     </dl>
</body>
</html>
