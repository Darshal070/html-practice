<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Navigation</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
  body {
    margin: 0;
  }

  nav {
    background-color: black;
    color: white;
    display: flex;
    padding: 10px 30px;
  }



  .c2 {
    display: flex;
    justify-content: center;
    flex: 1;
  }

  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
  }

  nav ul li {
    position: relative;
    margin: 0 15px;
  }

  nav ul li a {
    color: white;
    text-decoration: none;
    padding: 8px;
    display: block;
  }

  nav ul li:hover > ul {
    display: block;
  }

  nav ul ul {
    display: none;
    position: absolute;
    background-color: #2a2b33;
    top: 35px;
    left: 0;
    min-width: 150px;
  }

  nav ul ul li {
    margin: 0;
  }

  nav ul ul ul {
    left: 150px;
    top: 0;
  }

  .contact {
    margin-left: auto;
  }

  .c3:hover{
    background-color: gray;
  }

</style>

</head>
<body>
<nav>
  <div class="c1"><i class="fa-regular fa-building"></i>Company</div>
  <div class="c2">
    <ul>
      <li><a href="">Home</a></li>
      <li><a href="">Company</a></li>
      <li>
        <a href="">Analytics +</a>
        <ul>
          <li class="c3"><a href="">Overview</a></li>
          <li class="c3"><a href="">Transactions</a></li>
          <li class="c3">
            <a href="">Reports</a>
          </li>
        </ul>
      </li>
      <li><a href="">Products</a></li>
      <li><a href="">Users</a></li>
      <li> <a href="">Contacts</a></li>
    </ul>
  </div>
</nav>
</body>
</html>
