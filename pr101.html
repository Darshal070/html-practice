<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ul list </title>
</head>
<body>
    <ul>
        <li>mango</li>
         <li>apple</li>
        <li>banana</li>

    </ul>
    <script>
        let heading=document.createElement("h1")
        heading.innerText="unorder list"
        console.log(heading)

        let ul=document.querySelector("ul")
        ul.style.backgroundColor="yellow"
       // ul.append(heading)
       // ul.after(heading)
       // ul.before(heading)
        ul.prepend(heading)
    </script>
</body>
</html>
