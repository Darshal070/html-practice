<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="">
        <label for="name">First name :</label>
        <input type="text"  id="name" placeholder="First name...">
        <br><br>

        <label for="last">Last name :</label>
        <input type="text" id="last" placeholder="Last Name">
        <br>
        <label for="email">Email</label>
        <input type="email" name="" id="email" placeholder="enter email" required>
        <br>
        <label for="pass">password</label>
        <input type="password" id="pass">
        <br>
        <label for="">gender:</label><br>
        <label for="gender">male</label>
        <input type="radio" name="a" id="gender"><br>
         <label for="gen">Female</label>
        <input type="radio" name="a" id="gen"><br>
         <label for="gend">Other</label>
        <input type="radio" name="a" id="gend"><br>

        <label for="age">Age</label>
        <input type="age" id="age"><br>

        <label for="">Preferences:</label><br>
        <label for="a">Acrylic painting</label>
        <input type="checkbox"  id="a"><br>
        <label for="b">Oil painting</label>
        <input type="checkbox" id="b"><br>
        <label for="c">Water color painting</label>
        <input type="checkbox" id="c"><br>
        <label for="">bio</label><br>
        <textarea rows="10" cols="50" placeholder="Share few lines about yourself..." ></textarea>
        <br>
        <button>SUBMIT</button>
        <button>RESET</button>
        

        
    </form>
    
</body>
</html>
