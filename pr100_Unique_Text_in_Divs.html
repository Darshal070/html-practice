<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unique Text in Divs</title>
  </head>
  <body>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>

    <script>
      let boxes = document.querySelectorAll(".box");
      boxes[0].innerText = "This is the first box";
      boxes[1].innerText = "This is the second box";
      boxes[2].innerText = "This is the third box";
    </script>
  </body>
</html>
