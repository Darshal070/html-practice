<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop</title>
</head>
<body>
    <script>
        //For Loop
        for(let i=1;i<=10;i++)
        {
            console.log(i)
        }

        //While loop
        let n=Number(prompt("Enter the Number:"))
        let i=1;
        let sum=0;
        while(i<=n){
            sum=sum+i
            i++
        }
        console.log(sum)

        //Do-While Loop
        let x=11;
        do{
            console.log(x)
            x++;
        }while(x<=10)
    </script>
</body>
</html>
