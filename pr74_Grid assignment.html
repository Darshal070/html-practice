<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment of grid</title>
    <style>
        .parent{
            display: grid;
            grid-template-columns: repeat(3,100px);
            grid-template-rows: 100px 100px 100px 100px;
            justify-content: center;
            align-content: center;
            gap: 7px;
        }

        #i1{
            background-color: aquamarine;
            color: white;
            text-align: center;
            padding-top: 40px;
        }

        #i2{
            background-color: rgb(160, 107, 9);
            color: white;
            text-align: center;
            padding-top: 40px;
        }

         #i3{
            background-color: rgb(11, 229, 11);
            color: white;
            text-align: center;
            padding-top: 40px;
            grid-area: 2/2/4/4;
        }

         #i4{
            background-color: purple;
            color: white;
            text-align: center;
            padding-top: 40px;
        }

         #i5{
            background-color: rgb(244, 74, 102);
            color: white;
            text-align: center;
            padding-top: 40px;
        }

         #i6{
            background-color: rgb(115, 115, 249);
            color: white;
            text-align: center;
            padding-top: 40px;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="c1" id="i1">A</div>
        <div class="c1" id="i2">B</div>
        <div class="c1" id="i3">C</div>
        <div class="c1" id="i4">D</div>
        <div class="c1" id="i5">E</div>
        <div class="c1" id="i6">F</div>
        
    </div>
</body>
</html>
