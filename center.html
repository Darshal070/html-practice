<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body bgcolor="lightblue">

    <center>

    <h1>Registration Form</h1>

    <form>
        <label for="id">Student Id :</label>
        <input type="text" id="id" placeholder="Enter Student Id...">
        <br><br>
        <label for="uname">User Name :</label>
        <input type="text" id="uname" placeholder="Enter User Name...">
        <br><br>
        <label for="email">Email :</label>
        <input type="email" id="email" placeholder="Enter Email..." required>
        <br><br>
        <label for="pass">Password :</label>
        <input type="password" id="pass" placeholder="Enter Password...">
        <br><br>
        <label for="dob">DOB :</label>
        <input type="date" id="dob">
        <br><br>
        <label for="phone">Phone :</label>
        <input type="tel" id="phone" placeholder="Enter Phone Number...">
        <br><br>
        <label for="fee">Fee :</label>
        <input type="number" id="fee" placeholder="Enter Fee...">
        <br><br>
        <label>Course :</label><br>
        <label for="java">JAVA</label>
        <input type="checkbox" id="java"><br>
        <label for="jdbc">JDBC</label>
        <input type="checkbox" id="jdbc"><br>
        <label for="ejb">EJB</label>
        <input type="checkbox" id="ejb"><br>
        <label for="jsp">JSP</label>
        <input type="checkbox" id="jsp"><br><br>
        <label>Gender :</label><br>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male"><br>
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female"><br><br>

        <button>Register</button>

    </form>
    
    </center>

</body>

</html>
