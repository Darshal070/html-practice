<!DOCTYPE html>
<html>
<head>
    <title>Grocery Bill</title>
    <style>
        table{
            border-collapse: collapse;
            width: 70%;
            margin: auto;
        }
        th,td{
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }
        th{
            background-color: rgba(9, 169, 9, 0.934);
            color: white;
        }
        h1{
            text-align: center;
        }
    </style>
</head>
<body>
<h1>Grocery Items Bill</h1>
<table>
    <tr>
        <th>Item Name</th>
        <th>Quantity</th>
        <th>Price</th>
    </tr>
    <tr>
        <td>Potatoes</td>
        <td>51</td>
        <td>$1.00</td>
    </tr>
    <tr>
        <td>Nuts</td>
        <td>20</td>
        <td>$5.00</td>
    </tr>
    <tr>
        <td>Onions</td>
        <td>4</td>
        <td>$3.00</td>
    </tr>
    <tr>
        <td>Carrots</td>
        <td>12</td>
        <td>$2.99</td>
    </tr>
    <tr>
        <td colspan="2"><b>Total Price</b></td>
        <td>$33.79</td>
    </tr>
</table>
</body>
</html>
