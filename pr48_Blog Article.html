<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Article</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family: Arial, sans-serif;
        background:#f2f2f2;
    }

    nav{
        background:#c785c9;
        padding:25px 0;
        text-align:center;
    }

    nav a{
        text-decoration:none;
        color:gray;
        margin: 25px;
        font-size:18px;
        font-weight:bold;
        text-transform:uppercase;
    }

    .container{
        width:700px;
        margin:20px auto;
    }

    .date{
        font-size:20px;
        text-transform:uppercase;
        margin-bottom:20px;
    }

    .post-image{
        width:100%;
        height:auto;
        display:block;
    }

    h1{
        font-size:55px;
        margin:40px 0 25px;
        font-weight:normal;
    }

    p{
        font-size:20px;
        line-height:1.8;
        color:#333;
    }
</style>

</head>
<body>

    <nav>
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">BLOG</a>
    </nav>

    <div class="container">

        <div class="date">
            NOVEMBER 25 2015
        </div>

        <img src="https://images.unsplash.com/photo-1511044568932-338cba0ad803?w=800"
             alt="Cats"
             class="post-image">

        <h1>This Is My First Article</h1>

        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit.
            Eum et non, asperiores, numquam tenetur fuga quos vitae
            suscipit illo debitis excepturi doloremque ab provident
            quibusdam possimus accusamus neque. Id, nostrum.
        </p>

    </div>

</body>
</html>
