<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
</head>
<body>
    <script>
        let n = Number(prompt("Enter a number:"));
        let i = 1;

        do {
            document.write(n + " × " + i + " = " + (n * i) + "<br>");
            i++;
        } while (i <= 10); 
    </script>
</body>
</html>
