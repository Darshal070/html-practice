<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE</title>
    <style>
        th,td{
            border: 1px solid black;
        }
        table{
            padding: 5px;
            height: 300px;
            width: 500px;
        }
    </style>
</head>
<body>
    <h1>Presenting the data in HTML</h1>
    <table>
        <tr>
            <th>EmpID</th>
            <th>NAME</th>
            <th>SALARY</th>
            <th>Incentives</th>
        </tr>
        <tr>
            <td>1</td>
            <td>King</td>
            <td>56000</td>
            <td>10000</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Ernst</td>
            <td colspan="2">45000</td>
        </tr>
        <tr>
            <td>3</td>
            <td>John</td>
            <td colspan="2">54000</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Max</td>
            <td>61000</td>
            <td rowspan="2">20000</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Vish</td>
            <td>43000</td>
        </tr>
    </table>
</body>
</html>
