<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <style>
        .parent{
            border: 1px solid black;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(3,100px);
            grid-template-rows: 100px 100px 100px 100px;
            justify-content: center;
            align-content: center;
            gap: 5px;
        }

        .c1{
            border: 1px solid red;
        }

        #i1{
            order: 1;
        }

        #i2{
            grid-column:1/3;
        }

        #i4{
            grid-row: 2/4;
        }

        #i5{
            grid-area: 2/2/4/4;
        }


        
    </style>
</head>
<body>
    <div class="parent"> 
        <div class="c1" id="i1">1</div>
        <div class="c1" id="i2">2</div>
        <div class="c1" id="i3">3</div>
        <div class="c1" id="i4">4</div>
        <div class="c1" id="i5">5</div>
        <div class="c1" id="i6">6</div>
    </div>
</body>
</html>
