<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Form</title>
    <style>

        body{
            background-color: grey;
        }
        span{
            color: rgb(244, 162, 11);
        }

        h1{
            text-align: center;
        }

        .main{
            height: auto;
            width: 350px;
            background-color: lightgrey;
            border-radius: 25px 1px;
            margin: auto;
            margin-top: 80px;
            padding: 35px;
        }

        .btn{
             margin-left: 150px;
        }

        input{
            margin-left: 10px;
            width: 250px;
            box-shadow: 1px 1px 1px 2px lightgray;
        }

        .c1{
            margin-left: 20px;
        }

        .btn{
            background-color: rgb(170, 58, 58);
            border: none;
            border-radius: 5px;
            padding: 9px;
            margin-left: 125px;
            width: 100px;
        }
    </style>
</head>
<body>

    <form action="">   
        <div class="main">    
        <h1>Form<span>Get</span></h1> 
        <hr>
    <div class="parent">

        <div class="c1">Full Name: <br>
         <input type="text" placeholder="Full Name">
        </div>
        <br>

        <div class="c1">Email: <br>
        <input type="email" placeholder="Email">
        </div>
        <br>

        <div class="c1">Contact Number: <br>
        <input type="tel" placeholder="Contact Number">
        </div>
        <br>

        <div class="c1">Address: <br>
        <input type="text" placeholder="Address">
        </div>
        <br>

        <input class="btn" type="submit">

    </div>
    </div>
    </form>

</body>
</html>
