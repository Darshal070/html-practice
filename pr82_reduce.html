<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduce</title>
</head>
<body>
    <script>

        let arr = [1,2,3,4,5,6];

        let newArray = arr.reduce((accumulator,current) => {
            return accumulator = accumulator+current;
        })
        console.log(newArray);
        // document.write(newArray);
        


        let arr2 = arr.reduce((accumulator,current) => {
            return accumulator = accumulator*current;
        })
        console.log(arr2);
        // document.write(arr2)


         let arr3 = arr.reduce((accumulator,current) => {
            return accumulator = accumulator/current;
        })
        console.log(arr3);
        // document.write(arr3);

         let arr4 = arr.reduce((accumulator,current) => {
            return accumulator = accumulator-current;
        })
        console.log(arr4);
        // document.write(arr4);

    </script>
</body>
</html>
