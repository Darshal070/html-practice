<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav bar ex.2</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        nav{
            
            background-color: rgb(159, 79, 234);
            padding: 10px;
            width: 100%;
        }

        ul{
            list-style: none;
            color: aquamarine;
            display: flex;
            border: 2px solid black;


            
            padding: 10px;
        }

        li{
            border: 1px solid black;
            padding: 10px;
            margin: 5px;
        }

        a{
            text-decoration: none;
            color: black;
        }

        li:hover{
            background-color: bisque;
            border-radius: 10px;
        }
        
    </style>
</head>
<body>

    <nav>
        <ul>
            <li> <a href="">Mango</a></li>
            <li> <a href="">Apple</a></li>
            <li> <a href="">Banana</a></li>
            <li> <a href="">Orange</a></li>
        </ul>
    </nav>
    
</body>
</html>
