<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Feature</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      #main {
        width: 900px;
        margin: auto;
        padding: 20px;
      }

      h1 {
        text-align: center;
      }

      .intro {
        text-align: center;
        margin-top: 10px;
      }

      ul {
        list-style: none;
      }

      li {
        margin-top: 40px;
      }

      img {
        width: 60px;
        height: 60px;
        vertical-align: middle;
      }

      span {
        font-size: 25px;
        font-weight: bold;
        margin-left: 20px;
        vertical-align: middle;
      }

      .feature-text {
        margin-left: 85px;
        margin-top: 10px;
        text-align: left;
        line-height: 25px;
      }
    </style>
  </head>

  <body>
    <div id="main">
      <h1>OUR FEATURE</h1>

      <p class="intro">Sample text. Click to select the text box.</p>

      <ul>
        <li>
          <img src="mobile.png" alt="Customer Service" />
          <span>FRIENDLY CUSTOMER SERVICE</span>

          <p class="feature-text">Sample text. Click to select the text box.</p>
        </li>

        <li>
          <img src="setting.png" alt="Targeting" />
          <span>TARGETING & POSITIONING</span>

          <p class="feature-text">Sample text. Click to select the text box.</p>
        </li>

        <li>
          <img src="idea.png" alt="Ideas" />
          <span>UNIQUE IDEAS & SOLUTIONS</span>

          <p class="feature-text">Sample text. Click to select the text box.</p>
        </li>
      </ul>
    </div>
  </body>
</html>
