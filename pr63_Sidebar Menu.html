<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Menu</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

  <style>

    * {
      margin: 0;
      padding: 0;
    }

    div{
      width: 500px;
      display: inline-block;
      padding: 20px;
    }

    body {
      display: flex;
      background-color: white;
    }

    h1{
        font-size: 32px;
        color: grey;
    }

    nav {
      width: 200px;
      height: 100vh;
      background-color:rgb(76, 35, 114);
      color: white;
      display: inline-block;
      padding: 20px;
    }

     h2 {
      text-align: center;
    }

     ul {
      list-style: none;
    }

     li {
      padding: 15px;
    }

     li:hover {
      background-color:rgb(130, 5, 248);
    }
    
    a {
        text-decoration: none;
        color: white;
     }

     i{
        margin-right: 10px;
     }

     #i1{
        font-size: 30px;
        margin-top: 390px;
        margin-right: 25px;
     }

  </style>
</head>
<body>

  <nav>
    <h2>SIDEBAR</h2>
    <ul>
      <li><a href=""><i class="fa-regular fa-house"></i>Home</a></li>
      <li><a href=""><i class="fa-regular fa-user"></i>Profile</a></li>
      <li><a href=""><i class="fa-solid fa-circle-info"></i>About</a></li>
      <li><a href=""><i class="fa-solid fa-briefcase"></i>Portfolio</a></li>
      <li><a href=""><i class="fa-solid fa-blog"></i>Blogs</a></li>
      <li><a href=""><i class="fa-regular fa-envelope"></i>Contact</a></li>
      <li><a href=""><i class="fa-regular fa-map"></i>Map</a></li>
    </ul>

    <i id="i1" class="fa-brands fa-instagram"></i>
    <i id="i1" class="fa-brands fa-facebook"></i>
    <i id="i1" class="fa-brands fa-twitter"></i>
  </nav>

  <div>
    <h1>Welcome!! Have a nice day.</h1>
    <hr>
  </div>

</body>
</html>
