<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Login Form</h1>
    <form action="">
        <label for="user">Username</label>
        <input type="text" id="user" placeholder="Enter your name..." required>
        <br><br>

        <label for="mail">Email</label>
        <input type="email" id="mail" placeholder="Enter your email...">
        <br><br>

        <label for="pass">Password</label>
        <input type="password" id="pass" placeholder="Enter the password..." required>
        <br><br>

        <label for="skills">Select Skills:</label>
        <label for="HTML">HTML</label>
        <input type="checkbox" name="HTML" id="HTML">
        <label for="JS">JS</label>
        <input type="checkbox" name="JS" id="JS">
        <label for="python">Python</label>
        <input type="checkbox" name="Python" id="python"><br><br>
        
        <label for="gender">Gender :</label>
        <label for="male">Male</label>
        <input type="radio" id="male" name="Male" required>

        <label for="female">Female</label>
        <input type="radio" id="female" name="Male" required><br><br>

        <label for="">Address :</label><br>
        <textarea name="Address" id="add" rows="10" cols="20"></textarea>

        <br>
        <label for="">Date</label>
        <input type="datetime-local">
        <br>
        <label for="file">Resume</label>
        <input type="file" name="Upload the file" id="file">

        <input type="submit" value="Login">
        <button>reset</button>


    </form>
</body>
</html>
