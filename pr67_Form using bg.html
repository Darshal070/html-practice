<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <style>

        *{
            padding: 0px;
            margin: 0px;
        }

        body{
            background:linear-gradient(to right, rgb(124, 218, 250), rgb(239, 136, 153));
        }

        .c{
            margin: auto;
            height: auto;
            width: 350px;
            margin-top: 80px;
            padding: 20px;
            background-color: white;
            border-radius: 20px;
            padding-top: 30px;
        }

        .c1{
            padding: 7px;
            margin: 7px;
        }

        .input{
            border: none;
            box-shadow: 1px 1px 2px grey;
        }

        .btn{
            background-color: rgb(242, 135, 153);
            border: none;
            border-radius: 15px;
            padding: 7px;
            margin-left: 150px;
        }

        p{
            padding: 10px;
            text-align: center;
            margin-top: 4px;
        }

        h1{
            padding: 10px;
        }


    </style>

</head>

<body>
    
<form>
<div class="c">
    
    <div>
        <h1>Contact us</h1>
    </div>

    <div class="c1">
        <input class="input" type="text" placeholder="Full Name" required>
    </div>

    <div class="c1">
        <input class="input" type="email" placeholder="Email" required>
    </div>

    <div class="c1"> 
        <textarea class="input" placeholder="Your Message" rows="6" cols="44"></textarea>
    </div>

    <input class="btn" type="submit" value="Send Email">
    <p>Contact our 24/7 Call center <span>+91 8576 7557</span></p>

</div>
</form>
</body>

</html>
