<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        
            table,th,td{
                border: 1px solid black;
                border-collapse:collapse;
            }
            td,th{
                padding: 5px;
            }
            table{
                height: 200px;
                width: 200px;
            }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>AGE</th>
        </tr>
       <tr>
        <td>1</td>
        <td>Darshal</td>
        <td>18</td>
       </tr>
       <tr>
        <td>2</td>
        <td>Swarup</td>
        <td>19</td>
       </tr>
       <tr>
        <td>3</td>
        <td>jack</td>
        <td>20</td>
       </tr>
    </table>
</body>
</html>
