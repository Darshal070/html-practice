<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <style>

        #i1{ 
            height: 100px;
            width: 100px;
            border-radius: 10px;
            border: 3px solid black;
        }

        #i2{
            height: 100px;
            width: 100px;
            border-radius: 5px 20px;
            border: 4px groove yellow;
        }

        #i3{
            border-radius: 10px 20px 30px;
            border: 5px ridge brown;
        }

        #i4{
            border: 5px double red;
        }

        #i5{
            border: 4px dashed green;
        }

        #i6{
            border: 5px dotted blue;
        }

        #i7{
            border: 6px inset gray;
        }

        #i8{
            border: 6px outset red;
        }



        #i9{
            height: 100px;
            width: 100px;
            border: 7px double black;
            border-radius: 50%;
        }

        #i10{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            border-radius: 5px 20px 30px 40px;

        }

    </style>
</head>
<body>

    <p id="i1">solid border</p>
    <p id="i2">groove border</p>
    <p id="i3">ridge border</p>
    <p id="i4">double border</p>
    <p id="i5">dashed border</p>
    <p id="i6">dotted border</p>
    <p id="i7">inset border</p>
    <p id="i8">outset border</p>

    <p id="i9">Double Circle</p>
    <p id="i10">Border radius</p>

</body>
</html>
