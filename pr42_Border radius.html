<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border</title>
    <style>
        h1{
            color: gray;
            text-align: center;
        }

        p{
            display: inline-block;
            margin: 10px;
        }
        #i1{
            height: 100px;
            width: 100px;
            border: 3px solid blue;
            background-color: aqua;
            border-radius: 20px;
        }

        #i2{
            height: 100px;
            width: 100px;
            border: 2px solid blue;
            background-color: rgb(242, 191, 97);
            border-radius: 50%;
        }

        #i3{
            height: 100px;
            width: 100px;
            border: 3px solid blue;
           border-top-left-radius: 50%;
           border-bottom-left-radius: 50%;
           background-color: rgb(100, 212, 100);
        }

        #i4{
            height: 100px;
            width: 100px;
            border: 3px solid blue;
            border-top-left-radius: 50%;
            border-bottom-right-radius: 50%;
            background-color: rgb(247, 247, 114);
        }

    </style>
</head>
<body>
    <h1>CSS Border Radius</h1>
    <p id="i1"></p>
    <p id="i2"></p>
    <p id="i3"></p>
    <p id="i4"></p>

</body>
</html>
