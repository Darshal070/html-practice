<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Assignment</title>
    <Style>
        h1{
            text-align: center;
            font-size: 150%;
            color: red;
        }

        #i1{
            height: 100px;
            width: 100px;
            border: 3px solid black;
            border-radius: 50%;
            background-color: rgb(213, 21, 53);
        }

        #i2{
            border: 3px solid black;
            height: 30px;
            width: 150px;
            border-radius: 10px;
            background-color: rgb(239, 18, 55);
        }

        #i3{
            border: 3px solid black;
            height: 30px;
            width: 150px;
            background-color: rgb(239, 18, 55);
            border-radius: 30px 1px;
        }

         #i4{
            border: 6px inset grey;
            height: 30px;
            width: 150px;
            background-color: rgb(239, 18, 55);
            border-top-right-radius: 30px;
        }

         #i5{
            border: 3px solid black;
            height: 30px;
            width: 150px;
            background-color: rgb(239, 18, 55);
            border-top-left-radius: 30px;
            border-bottom-right-radius: 20px;
            border-top-right-radius: 8px;
        }

         #i6{
            border: 3px solid black;
            height: 30px;
            width: 150px;
            background-color: rgb(239, 18, 55);
            border-bottom-left-radius: 50px;
            border-top-right-radius: 50px;
            border-bottom-right-radius: 50px;
        }
         
        #i7{
            border: 3px solid black;
            height: 30px;
            width: 150px;
            background-color: rgb(239, 18, 55);
            border-top-left-radius: 35px;
        }

    </Style>
</head>
<body>
    <h1>Different Border Radius Properties</h1>


    <p id="i1"></p>
    <p id="i2"></p>
    <p id="i3"></p>
    <p id="i4"></p>
    <p id="i5"></p>
    <p id="i6"></p>
    <p id="i7"></p>

</body>
</html>
