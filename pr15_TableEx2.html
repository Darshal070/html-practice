<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
    <style>
        table,th,td{
            border: 1px solid black;
             border-collapse: collapse;
        }
        td,th{
            padding: 5px;
        }
        table{
            height: 300px;
            width: 500px;
        }
        th{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Table with broders and padding</h1>
    <table>
        <tr>
            <th>NAME</th>
            <th>JOB TITLE</th>
            <th>E-MAIL ADDRESS</th>
        </tr>
        <tr>
            <td>Anna Fitzgerald</td>
            <td>Staff writer</td>
            <td>@1company.com</td>
        </tr>
        <tr>
            <td>John smith</td>
            <td>Marketing Manager</td>
            <td>@2company.com</td>
        </tr>
        <tr>
            <td>Zendaya Grass</td>
            <td>CEO</td>
            <td>@3company.com</td>
        </tr>
    </table>
</body>
</html>
