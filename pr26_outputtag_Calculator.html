<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>output tag(Calculator)</title>
</head>
<body>
    <form oninput="x.value=Number(a.value)+ Number(b.value)"
     oninput="y.value=Number(a.value)+ Number(b.value)" >
        <input type="number" name="a" id="a">+
        <input type="number" name="b" id="b">=
        <output name="x" id="x"></output>
    </form>
    <br><br>

    <form oninput="y.value=Number(a.value) -Number(b.value)">
        <input type="number" name="a" id="a">-
        <input type="number" name="b" id="b">=
        <output name="y" id="y"></output>
    </form>
    <br><br>

     <form oninput="x.value=Number(a.value)* Number(b.value)"
     oninput="y.value=Number(a.value)* Number(b.value)" >
        <input type="number" name="a" id="a">*
        <input type="number" name="b" id="b">=
        <output name="x" id="x"></output>
    </form>
    <br><br>
    
    <form oninput="y.value=Number(a.value) / Number(b.value)">
        <input type="number" name="a" id="a">/
        <input type="number" name="b" id="b">=
        <output name="y" id="y"></output>
    </form>
    <br><br>

</body>
</html>
