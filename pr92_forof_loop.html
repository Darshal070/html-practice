<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPeration on Array</title>
</head>
<body>
    <script>
        //Finding MAX in Array
        let arr=[13,4,9,87,2]
        let MAX=arr[0]
        for(let i of arr){
            if(i>MAX){
                MAX=i
            }
        }
        console.log(MAX)

        //Finding MIN in array
        let MIN=arr[0]
        for(let el of arr){
            if(el<MIN){
                MIN=el
            }
        }
        console.log(MIN)

        //Finding Even in Array
        for(let a of arr){
            if(a%2==0){
                console.log(a)
            }
        }
    </script>
</body>
</html>
