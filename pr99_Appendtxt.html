<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Append Text</title>
</head>
<body>
    <h2 id="h2">Hello JavaScript</h2>

    <script>
        let h=document.getElementById("h2")
        h.innerText='Apna College Students'
        console.log(h.innerText)
    </script>
</body>
</html>
