<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <script>

        let emp = {
            name : 'xyz',
            dept : 'IT',
            salary : 50000,
            address : {
            pincode: 414009,
            city: 'pune',
            }
        }

        console.log(emp.dept ='HR');
        console.log(delete emp.salary);
        console.log(emp.salary = 5000);

        console.log(emp);
        
    </script>
</body>
</html>
