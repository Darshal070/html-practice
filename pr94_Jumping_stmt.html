<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jumping stmt</title>
  </head>
  <body>
    <script>
      //break statement
      for (let i = 1; i <= 10; i++) {
        if (i == 7) {
          break;
        }
        console.log("i num " + i);
      }
      //continue
      for (let x = 1; x <= 10; x++) {
        if (x == 7) {
          continue; // skips printing when x = 7
        }
        console.log("x num " + x);
      }
    </script>
  </body>
</html>
