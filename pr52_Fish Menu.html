<!DOCTYPE html>
<html>
<head>
    <title>Fish Menu</title>
    <style>
        body{
            margin:0;
            background:rgb(5, 178, 236);
        }

        .con{
            width:900px;
            margin:50px auto;
        }

        h1{
            color:white;
            font-size:50px;
            margin-bottom:50px;
        }

        .i1{
            display:flex;
            align-items:center;
            margin:10px 0;
        }

        .number{
            width:70px;
            height:60px;
            background:rgb(255, 255, 88);
            text-align:center;
            line-height:60px;
            font-size:28px;
            font-weight:bold;
            color:black;
            margin-right:15px;
            position: relative;
        }

        .i2{
            display:flex;
            align-items:center;
            margin:18px 0;
        }

        .i3{
            display:flex;
            align-items:center;
            margin: 10px;
        }

        .i4{
            display:flex;
            align-items:center;
            margin: 10px;
        }

        .text{
            flex:1;
            background:lightgrey;
            padding:15px 25px;
            font-size:22px;
            color:black;
        }

        li:hover{
            background:rgb(1, 10, 12);
            border-radius: 50px;
        }

    </style>
</head>
<body>

<div class="con">
    <h1>Fish Menu</h1>

    <div class="i1">
        <div class="number">1</div>
        <div class="text">Grilled Flatfish With Pistachio-Herb Sauce</div>
    </div>

    <div class="i2">
        <div class="number">2</div>
        <div class="text">Coconut Cod Chowder With Seasoned Oyster Crackers</div>
    </div>

    <div class="i3">
        <div class="number">3</div>
        <div class="text">Tamarind-Glazed Black Bass With Coconut-Herb Salad</div>
    </div>

    <div class="i4">
        <div class="number arrow">4</div>
        <div class="text">Spicy Sweet-and-Sour Salmon With Dates</div>
    </div>
</div>

</body>
</html>
