<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIN/MAX element in Array</title>
</head>
<body>
    <script>
        let arr = [20,50,40,30,25];

        let MAX = arr.reduce((MAX, currentel) => {
            return MAX = MAX < currentel ? currentel: MAX
        } ,arr [0]
    )
    console.log("MAX=",MAX);


        let MIN = arr.reduce((MIN, currentel) => {
            return MIN = MIN > currentel ? currentel: MIN
        } ,arr [0]
    )
    console.log("MIN=",MIN);

    </script>
</body>
</html>
