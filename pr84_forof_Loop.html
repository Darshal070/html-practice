<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For_of Loop</title>
</head>
<body>
    <script>

        let arr = [2,4,6,8];
        let sum = 0;

        for (let el of arr){
            sum += el;
        }
        console.log(sum);  

    </script>
</body>
</html>
