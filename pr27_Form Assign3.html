<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        div{
            border: 1px solid white;
            background-color: rgb(125, 237, 125);
            width: 450px;
        }
    </style>
</head>
<body style="background-color: rgb(73, 210, 27);">
    <form action="">
        <h3>Step1: Your Details</h3>
        <div>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="First and last name">
        </div>
        
        <div>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="example@domain.com">
        </div>

        <div>
        <label for="ph">phone:</label>
        <input type="tel" id="ph" placeholder="eg.+91 985201254">
        </div>

        <h3>Step2:Delivery address</h3>
        <div>
            <label for="add">Address:</label><br>
            <textarea name="" id="add" cols="20" rows="5"></textarea>
        </div>

        <div>
            <label for="pst">Post Code:</label>
            <input type="number" id="pst">
        </div>

        <div>
            <label for="co">Country:</label>
            <input type="text" id="co">
        </div>

        <h3>Step3: Car Details</h3>
        <div>
            <label for="">Card Type</label><br>
            <label for="card">VISA</label>
            <input type="radio" id="card">

            <label for="an">AmEX</label>
            <input type="radio" id="an">

            <label for="ms">Mastercard</label>
            <input type="radio" id="ms">
        </div>

        <div>
            <label for="card">Card Number</label>
            <input type="number" id="card">
        </div>

        <div>
            <label for="secu">Security Code</label>
            <input type="number" id="secu">
        </div>

        <div>
            <label for="name">Name of Card</label>
            <input type="text" id="name" placeholder="Exact name as on the card">
        </div><br>
        <div style="text-align: center;">

        <input type="submit" value="Buy IT!" style="color: white ;background-color: rgb(3, 53, 3);">
        </div>

    </form>
</body>
</html>
