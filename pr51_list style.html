<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list style</title>
    <style>

        ul{
            border: 2px solid black;
            list-style-type: none;
            width: 400px;
            margin: auto;
            list-style-image: url(fruits_3731055\ \(2\).png);
            list-style-position: inside;
            padding: 5px;
            background-color: rgb(230, 230, 119);
            
        }

        li:hover{
            background-color: aquamarine;
            transition: all 0.5s ease;
            border-radius: 50%;
        }

        li{
            border: 2px solid black;
            height: 100px;
            width: 100px;

        }

    </style>
</head>
<body>
    <ul>
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
        <li>Papaya</li>
    </ul>
</body>
</html>
